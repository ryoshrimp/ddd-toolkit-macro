[package]
name = "ddd-toolkit-macro"
version = "0.2.1"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
ddd-toolkit-core = { git = "ssh://git@github.com/ryoshrimp/ddd-toolkit-core.git", tag = "v0.2.0" }
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = "3.0.1"
zeroize = { version = "1.9.0", optional = true }


[features]
zeroize = ["dep:zeroize"]

[dev-dependencies]
trybuild = "1"
zeroize = "1.9.0"
